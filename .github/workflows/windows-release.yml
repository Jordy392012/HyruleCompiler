name: Windows EXE release

on:
  push:
    branches:
      - release/hyrule-builder
      - upgrade/hookshot-2.1.0
    tags:
      - v0.6.0-beta.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out Hyrule
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.12.0
      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Check pinned Hookshot source compatibility
        shell: pwsh
        run: |
          git clone --depth 1 --branch v2.1.0 https://github.com/NotRexed/Hookshot.git Hookshot
          python -c "from pathlib import Path; from hyrulefast.integration import patch_hookshot; p=Path('Hookshot'); assert patch_hookshot(p); assert not patch_hookshot(p); print('Hookshot v2.1.0 patch smoke test passed')"
      - name: Build single-file EXE
        shell: pwsh
        run: |
          pyinstaller launcher.py --onefile --windowed --clean --noconfirm --name HyruleBuilder --paths . --add-data "hyrulefast/pollpass.py;hyrulefast"
          if (!(Test-Path dist/HyruleBuilder.exe)) { throw "HyruleBuilder.exe was not produced" }
      - name: Test packaged EXE entry point
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path .\dist\HyruleBuilder.exe) -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged EXE self-test failed with exit code $($process.ExitCode)" }
      - name: Test EXE bootstrap and real compiler CLI
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path .\dist\HyruleBuilder.exe) -ArgumentList "--bootstrap-check" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA "HyruleBuilder\bootstrap-selftest.log"
            if (Test-Path $log) { Get-Content $log }
            throw "Packaged EXE bootstrap check failed with exit code $($process.ExitCode)"
          }
          Get-Content (Join-Path $env:LOCALAPPDATA "HyruleBuilder\bootstrap-selftest.log")
      - name: Create checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\HyruleBuilder.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  HyruleBuilder.exe" | Set-Content .\dist\SHA256SUMS -Encoding ascii
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyruleBuilder-Windows-x64
          path: |
            dist/HyruleBuilder.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Hyrule Builder v0.6.0-beta.1
          prerelease: true
          draft: false
          body: |
            Hyrule Builder 0.6.0-beta.1 upgrades the pinned compiler toolchain to official Hookshot v2.1.0.
            - One-file HyruleBuilder.exe; no separate Python installation.
            - Downloads official Hookshot v2.1.0 build tools and verifies each package's SHA-256 checksum.
            - Applies Hyrule's checked poll-pass and adaptive Vulkan background-worker patches.
            - Includes upstream Hookshot 2.1.0 renderer fixes for texture staging visibility, transient image-view failures,
              background resource-job failure handling, and cutscene/movie cue timing above a 60 FPS cap.
            - Requires the user's own supported game dump; no game data is included.
            CI checks patch compatibility/idempotence, the packaged EXE, tool-package integrity, and compiler CLI startup.
            It cannot run a game without the user's private dump. Radeon 680M cutscene stability and performance still need
            an in-game test on the target PC; these upstream fixes are not a guarantee that every driver-specific issue is gone.
          files: |
            dist/HyruleBuilder.exe
            dist/SHA256SUMS
